name: Tests & Coverage

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  # Run spec tests in matrix (no coverage upload here)
  spec-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.25.11', '1.26.x']
        preset: [mainnet, minimal]

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go-version }}

    - name: Cache Go modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ matrix.go-version }}-spectests-${{ hashFiles('tests/spectests/go.sum') }}

    - name: Download dependencies (spectests)
      run: |
        cd tests/spectests
        go mod download

    - name: Get spec tests version
      id: spec-version
      run: |
        # Get latest non-prerelease version
        VERSION=$(curl -s https://api.github.com/repos/ethereum/consensus-spec-tests/releases | \
          jq -r '.[] | select(.prerelease == false and .draft == false) | .tag_name' | \
          grep -v -E '(alpha|beta|rc|pre)' | \
          head -1)

        # Fallback if no version found
        if [ -z "$VERSION" ]; then
          VERSION="v1.5.0"
        fi

        echo "Spec tests version: ${VERSION}"
        echo "version=${VERSION}" >> $GITHUB_OUTPUT

    - name: Cache consensus spec tests
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: tests/spectests/consensus-spec-tests
        key: consensus-spec-tests-${{ matrix.preset }}-${{ steps.spec-version.outputs.version }}

    - name: Setup consensus spec test data
      run: |
        cd tests/spectests
        ./setup_test_data.sh setup ${{ matrix.preset }}
        echo "CONSENSUS_SPEC_TESTS_DIR=$(./setup_test_data.sh export ${{ matrix.preset }})" >> $GITHUB_ENV

    - name: Run spec tests with coverage
      run: |
        cd tests/spectests
        ./run_tests.sh ${{ matrix.preset }}
      env:
        CONSENSUS_SPEC_TESTS_DIR: ${{ env.CONSENSUS_SPEC_TESTS_DIR }}

    - name: Upload spec test coverage artifacts
      if: matrix.go-version == '1.25.11'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: coverage-spec-go1.25.11-${{ matrix.preset }}
        path: tests/spectests/spec-coverage.out

  # Run unit tests across all Go versions
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.22.x', '1.25.11', '1.26.x']

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go-version }}

    - name: Cache Go modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}

    - name: Download dependencies
      run: go mod download

    - name: Unpack compat-tests archives
      run: make unpack-compat-tests

    - name: Run codegen tests with coverage
      run: |
        mkdir coverage
        export GOCOVERDIR=$(pwd)/coverage
        go generate ./...
        go tool covdata textfmt -i=coverage -o=coverage-codegen.txt

    - name: Run unit tests with coverage (default, no-cgo and 32-bit in parallel)
      # These three variants are independent and each build their own cache, so
      # they run concurrently to overlap compile/link/idle gaps. The full -v
      # output is tee'd to a per-variant log (uploaded as an artifact); only a
      # concise view — package results, failures and panics, dropping the
      # per-test RUN/PASS spam — is streamed to the step log, prefixed so the
      # interleaved streams stay attributable. The step fails if any variant
      # fails (PIPESTATUS captures the go test exit regardless of the filter).
      run: |
        run_variant() {
          local name="$1" prefix="$2"; shift 2
          set +e
          "$@" 2>&1 | tee "unit-${name}.log" \
            | grep --line-buffered -vE '^[[:space:]]*(=== (RUN|PAUSE|CONT)|--- (PASS|SKIP))' \
            | sed -u "s/^/${prefix} /"
          echo "${PIPESTATUS[0]}" > "test-${name}.status"
        }
        run_variant default '[NORMAL]' env go test -v -race -coverprofile=coverage-unit.txt -coverpkg=./... ./... &
        run_variant nocgo '[NOCGO]' env CGO_ENABLED=0 go test -v -coverprofile=coverage-unit-nocgo.txt -coverpkg=./... ./... &
        run_variant 386 '[32BIT]' env GOARCH=386 CGO_ENABLED=0 go test -v -coverprofile=coverage-unit-386.txt -coverpkg=./... ./... &
        wait

        rc=0
        for name in default nocgo 386; do
          if [ "$(cat "test-${name}.status")" = 0 ]; then
            echo "[${name}] PASSED"
          else
            echo "[${name}] FAILED"
            rc=1
          fi
        done
        exit "${rc}"

    - name: Run endianness fallback tests with coverage
      # The dynssz_endian_generic tag swaps the compile-time hostLittleEndian
      # constant for the runtime-detected var, letting the tests force the
      # big-endian fallback paths of the bulk uint64 slice helpers on any host.
      run: |
        go test -v -race -tags dynssz_endian_generic -coverprofile=coverage-unit-endianness.txt -coverpkg=./... ./sszutils/

    - name: Upload verbose unit test logs
      # Persist the full -v output that the step log intentionally elides, so
      # the per-test detail stays available on demand (especially on failure).
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: unit-test-logs-go${{ matrix.go-version }}
        path: |
          unit-default.log
          unit-nocgo.log
          unit-386.log

    - name: Upload unit test coverage artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: coverage-unit-go${{ matrix.go-version }}
        path: |
          coverage-codegen.txt
          coverage-unit.txt
          coverage-unit-nocgo.txt
          coverage-unit-386.txt
          coverage-unit-endianness.txt

  # Collect and upload coverage after spec tests and unit tests complete
  unit-tests-and-coverage:
    runs-on: ubuntu-latest
    needs: [spec-tests, unit-tests]
    if: always()

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Check dependency results
      if: needs.spec-tests.result != 'success' || needs.unit-tests.result != 'success'
      run: |
        echo "spec-tests: ${{ needs.spec-tests.result }}"
        echo "unit-tests: ${{ needs.unit-tests.result }}"
        exit 1

    - name: Download spec test coverage artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: coverage-spec-go1.25.11-*
        path: spec-coverage-artifacts

    - name: Download unit test coverage artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: coverage-unit-go1.25.11

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload coverage artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: final-coverage-report
        path: |
          coverage-codegen.txt
          coverage-unit.txt
          coverage-unit-nocgo.txt
          coverage-unit-386.txt
          coverage-unit-endianness.txt
          spec-coverage-artifacts/

  # Run unit tests on a big-endian architecture (s390x via QEMU user emulation)
  # to catch endianness bugs in the unsafe bulk encoding helpers, which would
  # otherwise produce silently wrong SSZ on big-endian platforms.
  big-endian-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.25.11'

    - name: Cache Go modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-1.25.11-s390x-${{ hashFiles('**/go.sum') }}

    - name: Install QEMU user emulation
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-user-static

    - name: Download dependencies
      run: go mod download

    - name: Unpack compat-tests archives
      run: make unpack-compat-tests

    - name: Run unit tests on s390x
      # hasher and dynssz-gen take several minutes under emulation; skip them.
      # The endianness-critical helpers they use are covered by the sszutils
      # reference-vector tests, and the hasher known-answer tests (hardcoded
      # roots, run separately below) still verify the full hash pipeline.
      run: |
        GOARCH=s390x CGO_ENABLED=0 go test -exec qemu-s390x-static \
          $(go list ./... | grep -v -e '/hasher$' -e '/dynssz-gen$')
        GOARCH=s390x CGO_ENABLED=0 go test -exec qemu-s390x-static \
          -run 'TestKnownAnswer' ./hasher/

  # Run govulncheck to detect known vulnerabilities in dependencies
  govulncheck:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.25.11'

    - name: Run govulncheck
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
        govulncheck ./...

  # Quick smoke fuzz test to catch regressions early
  fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.25.11'

    - name: Cache Go modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-1.25.11-fuzz-${{ hashFiles('**/go.sum') }}

    - name: Download dependencies
      run: go mod download

    - name: Run smoke fuzz test
      env:
        GOMEMLIMIT: 4GiB
      run: |
        set -e

        REPORT_DIR="${RUNNER_TEMP}/fuzz-reports"
        mkdir -p "${REPORT_DIR}"

        # Generate a fresh corpus with a random seed
        SEED=$(od -A n -t u4 -N 4 /dev/urandom | tr -d ' ')
        echo "Generating corpus with seed=$SEED"
        rm -f tests/fuzz/corpus/*_gen.go
        go run ./tests/fuzz/cmd/generate -num-types 50 -seed "$SEED" -extended=true

        # Run fuzzer for 30 seconds
        go run ./tests/fuzz/cmd/fuzz \
          -duration 30s \
          -report-dir "${REPORT_DIR}" \
          -workers 2

        # Check for issues
        ISSUES=$(find "${REPORT_DIR}" -maxdepth 2 -name "issue-*" -type d 2>/dev/null | wc -l)
        if [ "$ISSUES" -gt "0" ]; then
          echo "::error::Smoke fuzz found $ISSUES issues!"
          for d in "${REPORT_DIR}"/round-*/issue-*/; do
            if [ -d "$d" ]; then
              echo "--- $(basename "$d") ---"
              cat "$d/details.txt"
            fi
          done
          exit 1
        fi
        echo "Smoke fuzz passed (seed=$SEED)"
