name: Post Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: read-all

jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.25'

    - name: Extract version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "release" ]; then
          echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
        else
          version=$(grep -oP 'Version = "\K[^"]+' codegen/version.go)
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "tag=v$version" >> $GITHUB_OUTPUT
        fi

    - name: Build dynssz-gen for multiple platforms
      run: |
        LDFLAGS_PKG="github.com/pk910/dynamic-ssz/codegen"
        BUILD_COMMIT="${{ steps.version.outputs.tag }}"
        BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        LDFLAGS="-s -w -X ${LDFLAGS_PKG}.BuildCommit=${BUILD_COMMIT} -X ${LDFLAGS_PKG}.BuildTime=${BUILD_TIME}"

        cd dynssz-gen

        # Linux amd64
        GOOS=linux GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o ../dynssz-gen-linux-amd64 .

        # Linux arm64
        GOOS=linux GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o ../dynssz-gen-linux-arm64 .

        # Windows amd64
        GOOS=windows GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o ../dynssz-gen-windows-amd64.exe .

        # macOS amd64
        GOOS=darwin GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o ../dynssz-gen-darwin-amd64 .

        # macOS arm64
        GOOS=darwin GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o ../dynssz-gen-darwin-arm64 .

    - name: Generate artifact attestations
      uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v2
      with:
        subject-path: |
          dynssz-gen-linux-amd64
          dynssz-gen-linux-arm64
          dynssz-gen-windows-amd64.exe
          dynssz-gen-darwin-amd64
          dynssz-gen-darwin-arm64

    - name: Upload binaries to release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        version="${{ steps.version.outputs.version }}"
        tag="${{ steps.version.outputs.tag }}"

        gh release upload "$tag" \
          "dynssz-gen-linux-amd64#dynssz-gen-${version}-linux-amd64" \
          "dynssz-gen-linux-arm64#dynssz-gen-${version}-linux-arm64" \
          "dynssz-gen-windows-amd64.exe#dynssz-gen-${version}-windows-amd64.exe" \
          "dynssz-gen-darwin-amd64#dynssz-gen-${version}-darwin-amd64" \
          "dynssz-gen-darwin-arm64#dynssz-gen-${version}-darwin-arm64"

  changelog:
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: master
        token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

    - name: Extract release info
      id: release_info
      run: |
        echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
        echo "date=$(echo '${{ github.event.release.published_at }}' | cut -dT -f1)" >> $GITHUB_OUTPUT

    - name: Update CHANGELOG.md
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        chmod +x .github/scripts/update-changelog.sh
        .github/scripts/update-changelog.sh "${{ steps.release_info.outputs.tag }}" "${{ steps.release_info.outputs.date }}"

    - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
      with:
        commit_message: "update CHANGELOG.md for ${{ github.event.release.tag_name }}"
        branch: master
        file_pattern: CHANGELOG.md

  docker:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    - name: Login to Docker Hub
      uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4.5.0
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "release" ]; then
          echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
        else
          version=$(grep -oP 'Version = "\K[^"]+' codegen/version.go)
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "tag=v$version" >> $GITHUB_OUTPUT
        fi

    - name: Build and push Docker image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        push: true
        tags: |
          pk910/dynamic-ssz:${{ steps.version.outputs.version }}
          pk910/dynamic-ssz:latest
        platforms: linux/amd64,linux/arm64
        build-args: |
          BUILD_COMMIT=${{ steps.version.outputs.tag }}
          BUILD_TIME=${{ github.event.release.published_at || github.event.repository.updated_at }}
