# Config for the main batch of generated SSZ code.
# Paths are resolved relative to this file's directory.
#
# The per-type `output` override groups related types into a single file so
# cross-references between them (e.g. SimpleTypes1 ↔ SimpleTypes1_C1) are
# emitted as method calls instead of inlined duplicates.

package: github.com/pk910/dynamic-ssz/codegen/tests
output: gen_ssz.go
legacy: true
with-streaming: true

types:
  - SimpleBool
  - SimpleUint8
  - SimpleUint16
  - SimpleUint32
  - SimpleUint64
  - SimpleByteVec32
  - SimpleUint64Vec4

  - name: SimpleTypes1
    output: gen_simple1.go
  - name: SimpleTypes1_C1
    output: gen_simple1.go

  - name: NestedDelegatedContainer
    output: gen_nesteddelegated.go
  - name: NestedDelegatedDynContainer
    output: gen_nesteddelegated.go
  - name: MixedDelegatedContainer
    output: gen_nesteddelegated.go

  - name: SimpleTypes2
    output: gen_simple2.go
  - name: SimpleTypes3
    output: gen_simple3.go

  - name: SimpleTypesWithSpecs
    output: gen_withspecs.go
  - name: SimpleTypesWithSpecs_C1
    output: gen_withspecs.go
  - name: SimpleTypesWithSpecs_C2
    output: gen_withspecs.go

  - name: SimpleTypesWithSpecs2
    output: gen_withspecs2.go
  - name: SimpleTypesWithSpecs_C3
    output: gen_withspecs2.go

  - name: SpecMatrix
    output: gen_specmatrix.go

  - name: SpecShrunkList
    output: gen_specshrunk.go
  - name: SpecShrunkElem
    output: gen_specshrunk.go
  - name: SpecVecList
    output: gen_specshrunk.go
  - name: SpecVecElem
    output: gen_specshrunk.go

  - name: ListOfList
    output: gen_listoflist.go
  - name: Bytes2D
    output: gen_listoflist.go
  - name: VecOfList
    output: gen_listoflist.go

  - name: ClassicUnionTypes
    output: gen_progressive.go
  - name: ProgressiveTypes
    output: gen_progressive.go
  - name: ProgIndexOnly
    output: gen_progressive.go
  - name: ProgBitlistZeroTop
    output: gen_progressive.go
  - name: CustomTypes1
    output: gen_custom.go
  - name: CoverageTypes1
    output: gen_coverage.go
  - name: CoverageTypes7
    output: gen_coverage.go

  - name: OptionalListTypes
    output: gen_optionallist.go
  - name: OptionalListTypes_Inner
    output: gen_optionallist.go
  - name: OptionalListSliceVector
    output: gen_optionallist.go
  - name: UnionExprVariantSize
    output: gen_optionallist.go
  - name: VecDynElemExprSize
    output: gen_optionallist.go
  - name: VecDynElemExprSize_Inner
    output: gen_optionallist.go

  - name: ViewTypes1_Base
    output: gen_viewtypes1.go
    views:
      - ViewTypes1_View1
      - ViewTypes1_View2
      - github.com/pk910/dynamic-ssz/codegen/tests/views.ViewTypes1_View3

  - name: ViewTypes2_Base
    output: gen_viewtypes2.go
    views:
      - ViewTypes2_View1
      - ViewTypes2_View2

  - name: ViewTypes3_Base
    output: gen_viewtypes3.go
    view-only: true
    views:
      - ViewTypes3_View1

  - name: ViewTypes5_Base
    output: gen_viewtypes5.go
    view-only: true
    views:
      - ViewTypes5_View1

  - name: StreamVecDynSize
    output: gen_divergence.go
  - name: StreamVecElem
    output: gen_divergence.go
  - name: SizeUnionExprVariant
    output: gen_divergence.go
  - name: MultiDimSpecVec
    output: gen_divergence.go
  - name: NoMaxBitlist
    output: gen_divergence.go
  - name: NamedBitlistContainer
    output: gen_divergence.go
  - name: BitvecEdge
    output: gen_divergence.go
  - name: UnionDynVariant
    output: gen_divergence.go
  - name: UnionTaggedSelectors
    output: gen_divergence.go
  - name: PtrUnionVariant
    output: gen_divergence.go
  - name: ClassicUnionDynVariant
    output: gen_divergence.go
  - name: ClassicUnionPtrVariant
    output: gen_divergence.go
  - name: AliasedVecPair
    output: gen_divergence.go
  - name: TopLevelBitlist
    output: gen_toplevel.go
  - name: TopLevelProgBitlist
    output: gen_toplevel.go
  - name: TopLevelString
    output: gen_toplevel.go
  - name: TopLevelCtrList
    output: gen_toplevel.go
  - name: TopLevelCtrVec
    output: gen_toplevel.go
  - name: TopLevelVarList
    output: gen_toplevel.go
  - name: TopLevelListOfList
    output: gen_toplevel.go
  - name: TopLevelStructWrapper
    output: gen_toplevel.go
  - name: TopLevelWrapVarList
    output: gen_toplevel.go
  - name: TopVecOfVar
    output: gen_compilecorrectness.go
  - name: UnionSamePkgVariant
    output: gen_compilecorrectness.go
  - name: ClassicUnionSamePkgVariant
    output: gen_compilecorrectness.go
  - name: PtrPrimitiveList
    output: gen_compilecorrectness.go
  - name: FixedVecPtrStr
    output: gen_compilecorrectness.go
  - name: FixedVecPtrList
    output: gen_compilecorrectness.go
  - name: FixedVecStr
    output: gen_compilecorrectness.go
  - name: ShortLargeUintVec
    output: gen_compilecorrectness.go
  - name: PtrDynCollectionField
    output: gen_compilecorrectness.go
  - name: WrapUnionField
    output: gen_compilecorrectness.go
  - name: WrapClassicUnionField
    output: gen_compilecorrectness.go
  - name: ExcludedFields
    output: gen_compilecorrectness.go
  - name: PtrSvecOfList
    output: gen_compilecorrectness.go
  - name: WrapPtrList
    output: gen_compilecorrectness.go
  - name: WideDynamicElement
    output: gen_compilecorrectness.go
  - name: WideDynamicList
    output: gen_compilecorrectness.go

  # Recursive shapes: generated in one file so the recursive references are
  # emitted as method calls between the members.
  - name: RecursiveNode
    output: gen_recursive.go
  - name: RecursiveTree
    output: gen_recursive.go
  - name: RecursiveTreeBranch
    output: gen_recursive.go
  - name: RecursiveViewNode
    output: gen_recursive.go
    views:
      - RecursiveViewNode_View1

  - name: DynSizeVectorNoStatic
    output: gen_dynsizevec.go
